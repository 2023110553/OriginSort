name: Windows validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,gui,build]"
      - name: Run tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build executable
        run: pyinstaller OriginSort.spec --clean --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: OriginSort-Windows
          path: dist/OriginSort.exe

